[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc-models"
version = "0.0.0"
description = "Phase-field-crystal model catalogue: shared substrate plus one self-contained model per variant"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
gpu      = ["cupy-cuda12x"]
cpu      = ["pyfftw", "numba"]
analysis = ["h5py", "scikit-image"]
viz      = ["matplotlib", "plotly", "ipython"]
dev      = ["pytest", "ruff", "nbstripout"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pfc_models" = ["models/*/model.toml", "models/*/model.md"]

[tool.ruff]
line-length = 100
